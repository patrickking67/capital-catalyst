# Tool configuration only. The app is not packaged.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", ".venv", ".worktrees", ".claude/worktrees", "instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
norecursedirs = [".venv", "venv", ".worktrees", ".claude", "instance"]
